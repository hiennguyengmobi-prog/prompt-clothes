<!DOCTYPE html>

<style>*, ::before, ::after{--tw-border-spacing-x:0;--tw-border-spacing-y:0;--tw-translate-x:0;--tw-translate-y:0;--tw-rotate:0;--tw-skew-x:0;--tw-skew-y:0;--tw-scale-x:1;--tw-scale-y:1;--tw-pan-x: ;--tw-pan-y: ;--tw-pinch-zoom: ;--tw-scroll-snap-strictness:proximity;--tw-gradient-from-position: ;--tw-gradient-via-position: ;--tw-gradient-to-position: ;--tw-ordinal: ;--tw-slashed-zero: ;--tw-numeric-figure: ;--tw-numeric-spacing: ;--tw-numeric-fraction: ;--tw-ring-inset: ;--tw-ring-offset-width:0px;--tw-ring-offset-color:#fff;--tw-ring-color:rgb(59 130 246 / 0.5);--tw-ring-offset-shadow:0 0 #0000;--tw-ring-shadow:0 0 #0000;--tw-shadow:0 0 #0000;--tw-shadow-colored:0 0 #0000;--tw-blur: ;--tw-brightness: ;--tw-contrast: ;--tw-grayscale: ;--tw-hue-rotate: ;--tw-invert: ;--tw-saturate: ;--tw-sepia: ;--tw-drop-shadow: ;--tw-backdrop-blur: ;--tw-backdrop-brightness: ;--tw-backdrop-contrast: ;--tw-backdrop-grayscale: ;--tw-backdrop-hue-rotate: ;--tw-backdrop-invert: ;--tw-backdrop-opacity: ;--tw-backdrop-saturate: ;--tw-backdrop-sepia: ;--tw-contain-size: ;--tw-contain-layout: ;--tw-contain-paint: ;--tw-contain-style: }::backdrop{--tw-border-spacing-x:0;--tw-border-spacing-y:0;--tw-translate-x:0;--tw-translate-y:0;--tw-rotate:0;--tw-skew-x:0;--tw-skew-y:0;--tw-scale-x:1;--tw-scale-y:1;--tw-pan-x: ;--tw-pan-y: ;--tw-pinch-zoom: ;--tw-scroll-snap-strictness:proximity;--tw-gradient-from-position: ;--tw-gradient-via-position: ;--tw-gradient-to-position: ;--tw-ordinal: ;--tw-slashed-zero: ;--tw-numeric-figure: ;--tw-numeric-spacing: ;--tw-numeric-fraction: ;--tw-ring-inset: ;--tw-ring-offset-width:0px;--tw-ring-offset-color:#fff;--tw-ring-color:rgb(59 130 246 / 0.5);--tw-ring-offset-shadow:0 0 #0000;--tw-ring-shadow:0 0 #0000;--tw-shadow:0 0 #0000;--tw-shadow-colored:0 0 #0000;--tw-blur: ;--tw-brightness: ;--tw-contrast: ;--tw-grayscale: ;--tw-hue-rotate: ;--tw-invert: ;--tw-saturate: ;--tw-sepia: ;--tw-drop-shadow: ;--tw-backdrop-blur: ;--tw-backdrop-brightness: ;--tw-backdrop-contrast: ;--tw-backdrop-grayscale: ;--tw-backdrop-hue-rotate: ;--tw-backdrop-invert: ;--tw-backdrop-opacity: ;--tw-backdrop-saturate: ;--tw-backdrop-sepia: ;--tw-contain-size: ;--tw-contain-layout: ;--tw-contain-paint: ;--tw-contain-style: }</style></head>
<body class="h-full flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Notification Toast -->
  <div id="toast" class="fixed top-4 left-4 right-4 sm:left-auto sm:right-5 z-50 transform transition-all duration-300 ease-out flex items-center justify-center sm:justify-start gap-3 bg-indigo-600 text-white px-4 py-3 rounded-2xl shadow-2xl border border-indigo-400/30 translate-y-[-120px] opacity-0">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 shrink-0"><path d="M21.801 10A10 10 0 1 1 17 3.335"></path><path d="m9 11 3 3L22 4"></path></svg>
    <span id="toast-message" class="font-medium text-sm text-center sm:text-left">Đã sao chép thành công!</span>
  </div>

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/90 backdrop-blur sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center justify-between w-full sm:w-auto">
        <div class="flex items-center gap-2.5">
          <div class="p-2 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30 shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path></svg>
          </div>
          <div>
            <h1 class="font-bold text-base sm:text-lg leading-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">Prompt Vault</h1>
            <p class="text-[11px] text-slate-400 hidden sm:block">Quản lý &amp; Phân tích trang phục AI</p>
          </div>
        </div>
        <!-- Nút thêm prompt dạng icon trên mobile cho gọn -->
        <button onclick="openModal()" class="sm:hidden flex items-center justify-center bg-indigo-600 hover:bg-indigo-500 text-white p-2.5 rounded-xl shadow-lg shadow-indigo-600/20 transition">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
        </button>
      </div>

      <!-- Quick Action Buttons -->
      <div class="flex items-center gap-1.5 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0 scrollbar-none">
        <button onclick="copyQuanTatPrompt()" class="shrink-0 flex items-center gap-1 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white text-xs font-semibold px-3 py-2 rounded-xl border border-rose-500/30 transition">
          <span>Quần tất</span>
        </button>
        <button onclick="copyCrocsPrompt()" class="shrink-0 flex items-center gap-1 bg-amber-600/20 hover:bg-amber-600 text-amber-300 hover:text-white text-xs font-semibold px-3 py-2 rounded-xl border border-amber-500/30 transition">
          <span>Crocs</span>
        </button>
        <button onclick="copyGiayCaoGotPrompt()" class="shrink-0 flex items-center gap-1 bg-purple-600/20 hover:bg-purple-600 text-purple-300 hover:text-white text-xs font-semibold px-3 py-2 rounded-xl border border-purple-500/30 transition">
          <span>Giày gót đen</span>
        </button>
        <button onclick="exportSelfContainedHTML()" class="shrink-0 flex items-center gap-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-3 py-2 rounded-xl border border-slate-700 transition">
          <span>Xuất HTML</span>
        </button>
        <button onclick="openModal()" class="hidden sm:flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3.5 py-2 rounded-xl shadow-lg shadow-indigo-600/20 transition">
          <span>+ Thêm Prompt</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-4 sm:space-y-6">
    <div class="bg-slate-800/60 backdrop-blur rounded-2xl p-3.5 sm:p-4 border border-slate-700/60 shadow-xl space-y-3">
      <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
        <div class="relative flex-1">
          <input type="text" id="search-input" oninput="handleSearchOrFilter()" placeholder="Tìm kiếm mô tả, prompt..." class="w-full pl-3.5 pr-3.5 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-sm focus:outline-none focus:border-indigo-500 text-slate-200 placeholder-slate-500">
        </div>
        <button onclick="clearFilters()" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium py-1 self-end sm:self-center">Xóa bộ lọc</button>
      </div>
      <div>
        <div class="flex items-center gap-1.5 overflow-x-auto pb-1">
          <button id="btn-filter-fav" onclick="toggleFavoriteFilter()" class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 bg-slate-900/90 text-slate-300 border border-slate-700/75">
            <span>❤️ Đã thích</span>
            <span id="fav-count-badge" class="text-[10px] opacity-75 bg-slate-800 px-1.5 py-0.5 rounded-full">0</span>
          </button>
          <div class="h-4 w-px bg-slate-700 shrink-0 mx-0.5"></div>
          <div id="tag-cloud" class="flex items-center gap-1.5 overflow-x-auto pr-1"></div>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-between text-xs sm:text-sm text-slate-400 px-1">
      <div id="prompt-count">Hiển thị 0 / 0 prompt</div>
    </div>

    <div id="prompt-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5"></div>
    <div id="pagination-container" class="flex justify-center items-center gap-1.5 sm:gap-2 pt-4 pb-6"></div>

    <div id="empty-state" class="hidden text-center py-12 sm:py-16 bg-slate-800/30 rounded-2xl border border-dashed border-slate-700">
      <h3 class="text-sm sm:text-base font-semibold text-slate-300">Không tìm thấy Prompt nào</h3>
    </div>
  </main>

  <!-- Modal Form -->
  <div id="prompt-modal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 overflow-y-auto">
    <div class="bg-slate-900 border-t sm:border border-slate-700 rounded-t-3xl sm:rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-800 bg-slate-900/50 shrink-0">
        <h2 id="modal-title" class="text-base sm:text-lg font-bold text-slate-100">Thêm Prompt Mới</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 p-1">✕</button>
      </div>
      <form id="prompt-form" onsubmit="savePrompt(event)" class="p-4 sm:p-6 space-y-4 overflow-y-auto flex-1">
        <input type="hidden" id="prompt-id">
        <div class="space-y-1.5">
          <label class="block text-xs sm:text-sm font-semibold text-slate-200">Nội dung Prompt Chi Tiết *</label>
          <textarea id="form-full-prompt" required rows="5" oninput="handlePromptInput()" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs sm:text-sm text-slate-100 font-mono" placeholder="Dán prompt chi tiết vào đây, hệ thống sẽ tự động phân tích..."></textarea>
        </div>
        <div class="space-y-1.5">
          <label class="block text-xs sm:text-sm font-semibold text-slate-200">Mô tả ngắn trang phục (Tự động)</label>
          <input type="text" id="form-short-desc" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs sm:text-sm text-slate-100">
        </div>
        <div class="space-y-1.5">
          <label class="block text-xs sm:text-sm font-semibold text-slate-200">Thẻ Tag (Tự động phân tách)</label>
          <input type="text" id="form-tags" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs sm:text-sm text-slate-100">
        </div>
        <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-800 shrink-0">
          <button type="button" onclick="closeModal()" class="px-4 py-2.5 bg-slate-800 text-slate-300 text-xs sm:text-sm font-medium rounded-xl">Hủy</button>
          <button type="submit" class="px-5 py-2.5 bg-indigo-600 text-white text-xs sm:text-sm font-semibold rounded-xl">Lưu Prompt</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const INITIAL_PROMPTS = [
      {
        "id": "p_1792393598707",
        "isFavorite": false,
        "fullPrompt": "tỉ lệ khung hình 9:16 Tạo 4 ảnh 4 tư thế khác nhau phải trái trên dưới, đứng ngồi, xóa chữ biểu tượng trong ảnh, khôi phục những chi tiết bị mờ nhòe\n# PROMPT MÔ TẢ TRANG PHỤC – ULTRA-PHOTOREALISTIC 8K – DỌC 9:16\n\n**1. Áo sơ mi trắng dáng rộng mặc kiểu lệch vai**\n\nCô gái mặc một chiếc áo sơ mi nữ màu trắng tinh, dáng rộng kiểu oversized, chiều dài qua hông và gần giữa đùi, được tạo kiểu như một chiếc sơ mi dáng dài. Chất liệu vải cotton pha mềm mại, mỏng vừa phải, bề mặt mịn với độ bóng nhẹ tự nhiên, không xuyên thấu quá mức.\n\nÁo có cổ bẻ truyền thống, hàng cúc trắng nhỏ chạy dọc chính giữa thân áo. Thiết kế tay dài rộng rãi, vai áo trễ nhẹ, phần cổ áo mở rộng và trượt xuống một bên vai, để lộ đường vai tự nhiên. Thân áo buông lỏng theo cơ thể, không bó sát, tạo những nếp gấp mềm mại tại khuỷu tay, eo, thân trước và phần gấu áo.\n\nCổ tay áo dài, có măng sét bản vừa và cúc cài màu trắng. Phần gấu áo cong nhẹ, hai vạt trước tạo đường xẻ nhỏ ở chính giữa phía dưới. Vải có các nếp nhăn nhỏ chân thực, thể hiện độ mềm và độ rủ tự nhiên. Tổng thể mang phong cách tối giản, thanh lịch, nhẹ nhàng.\n\n**2. Tất dài màu trắng cao quá gối**\n\nCô gái mang một đôi tất dài màu trắng ngà, kéo cao đến phần đùi ngay phía trên đầu gối. Tất có thiết kế ôm sát chân, chất liệu dệt kim co giãn mềm mại, độ dày vừa phải, không xuyên thấu.\n\nBề mặt tất có các đường gân dệt dọc nhỏ, chạy đều từ phần viền trên xuống đến bàn chân. Phần viền trên có bo chun đàn hồi nhẹ, ôm vừa vặn đùi, mép tất phẳng và gọn gàng. Chất liệu vải thể hiện rõ kết cấu sợi dệt, các nếp nhăn ngang nhỏ xuất hiện tự nhiên tại đầu gối, cổ chân và mu bàn chân. Màu trắng đồng nhất, không có logo, chữ in hoặc họa tiết trang trí.\n\nTất bao phủ toàn bộ bàn chân, phần mũi tất bo tròn tự nhiên, không có giày dép bên ngoài. Hai chiếc tất cân đối về chiều dài, màu sắc và độ ôm.\n\n**3. Phụ kiện**\n\nCô gái cầm điện thoại thông minh màu trắng bạc, cụm camera sau gồm ba ống kính màu đen, thiết kế hiện đại. Đeo một sợi dây chuyền bạc mảnh với mặt dây nhỏ tinh tế và đôi khuyên tai nhỏ tối giản.\n\n**4. Phong cách tổng thể**\n\nPhong cách thời trang nữ tối giản, nhẹ nhàng, hiện đại, với bảng màu chủ đạo trắng và trắng ngà. Áo sơ mi dáng rộng kết hợp tất dài cao quá gối tạo nên tổng thể đồng nhất, mềm mại và thanh lịch. Trang phục có độ rủ tự nhiên, không quá cứng, không xuất hiện chi tiết trang trí không cần thiết.\n\n**5. Chất lượng hình ảnh**\n\nUltra-photorealistic, 8K, high-end fashion photography, realistic cotton texture, detailed knitted fabric, natural fabric folds, accurate white balance, realistic skin texture, soft warm indoor lighting, natural shadows, sharp focus, realistic proportions, cinematic color grading nhẹ.\n\n**6. Yêu cầu khi chỉnh sửa ảnh tham chiếu**\n\nSử dụng ảnh tham chiếu làm nguồn chính. Giữ nguyên nhân vật, khuôn mặt, kiểu tóc đen dài, biểu cảm, tư thế selfie trước gương, điện thoại, tỷ lệ cơ thể và góc chụp. Giữ nguyên bối cảnh phòng ngủ với giường ga trắng, rèm màu be, sàn gỗ sáng và ánh đèn vàng ấm. Chỉ tái tạo trang phục theo mô tả: áo sơ mi trắng oversized mặc lệch vai và tất trắng dài cao quá gối. Bảo toàn các chi tiết không được yêu cầu thay đổi, đảm bảo vải và tất có kết cấu chân thực như ảnh chụp người thật.\n\n**Negative prompt:** áo sơ mi màu khác, áo crop top, áo bó sát, chân váy, quần short, tất đen, tất ngắn cổ, tất có họa tiết, giày cao gót, giày thể thao, vải nhựa giả tạo, da nhựa, biến dạng cơ thể, chân tay méo mó, thừa ngón chân, tất nhăn bất thường, sai tỷ lệ cơ thể, thay đổi khuôn mặt, đổi kiểu tóc, thay đổi bối cảnh, hoạt hình, CGI, tranh vẽ, ảnh mờ, watermark, logo không mong muốn.",
        "shortDesc": "Áo sơ mi trắng dáng rộng mặc lệch vai kết hợp tất dài trắng cao quá gối.",
        "tags": ["Sơ mi", "Trắng", "Photorealistic"]
      },
      {

    function loadPrompts() {

    function handlePromptInput() {
      const text = document.getElementById("form-full-prompt").value;
      const matchedTags = new Set(["Photorealistic"]);
      const descParts = [];

      KEYWORD_RULES.forEach(rule => {
        if (rule.regex.test(text)) {
          matchedTags.add(rule.tag);
          if (rule.descVi) descParts.push(rule.descVi);
          if (rule.colorVi) descParts.push(rule.colorVi);
          if (rule.matVi) descParts.push(rule.matVi);
        }
      });

      document.getElementById("form-tags").value = Array.from(matchedTags).join(", ");

      if (descParts.length > 0) {
        const uniqueDesc = Array.from(new Set(descParts)).join(" kết hợp ");
        const finalDesc = uniqueDesc.charAt(0).toUpperCase() + uniqueDesc.slice(1) + ".";
        document.getElementById("form-short-desc").value = finalDesc;
      } else {
        document.getElementById("form-short-desc").value = "Mô tả trang phục AI tùy chỉnh";
      }
    }

    async function copyToClipboard(text, message) {
      try {
        await navigator.clipboard.writeText(text);
        showToast(message);
      } catch (err) {
        const dummy = document.createElement("textarea");
        document.body.appendChild(dummy);
        dummy.value = text;
        dummy.select();
        try {
          document.execCommand("copy");
          showToast(message);
        } catch (e) {
          showToast("Không thể sao chép!");
        }
        document.body.removeChild(dummy);
      }
    }

    function renderPrompts() {
      const grid = document.getElementById("prompt-grid");
      const emptyState = document.getElementById("empty-state");
      const tagCloud = document.getElementById("tag-cloud");
      const countEl = document.getElementById("prompt-count");
      const paginationContainer = document.getElementById("pagination-container");

      const tagCounts = {};

        const matchesTag = selectedTag ? (p.tags && p.tags.includes(selectedTag)) : true;
        const matchesFav = filterFavoriteOnly ? p.isFavorite : true;
        return matchesSearch && matchesTag && matchesFav;
      });

      countEl.textContent = `Hiển thị ${filtered.length} / ${prompts.length} prompt`;

        paginationContainer.innerHTML = "";

      const shortDesc = document.getElementById("form-short-desc").value.trim();
      const tagsString = document.getElementById("form-tags").value.trim();

      const tags = tagsString ? tagsString.split(',').map(t => t.trim()).filter(t => t.length > 0) : ["Chung"];
      if (!fullPrompt) return;

      if (id) {
        const index = prompts.findIndex(p => p.id === id);
        if (index !== -1) {
          prompts[index] = { ...prompts[index], fullPrompt, shortDesc: shortDesc || "Mô tả ngắn", tags };
        }
      } else {
        prompts.unshift({
          id: "p_" + Date.now(),
          fullPrompt,
          shortDesc: shortDesc || "Mô tả ngắn",
          tags,
          isFavorite: false
        });
      }

      saveToLocalStorage();
      renderPrompts();
      closeModal();
    }

      document.getElementById("form-short-desc").value = p.shortDesc;

      document.getElementById("prompt-modal").classList.remove("hidden");

      await copyToClipboard(text, "Đã sao chép prompt thành công!");
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      document.getElementById("toast-message").textContent = msg;
      t.classList.remove("translate-y-[-120px]", "opacity-0");
      setTimeout(() => { t.classList.add("translate-y-[-120px]", "opacity-0"); }, 2000);
    }

    function exportSelfContainedHTML() {
      const currentDoc = document.documentElement.cloneNode(true);
      let htmlString = "<!DOCTYPE html>\n" + currentDoc.outerHTML;
      const serializedData = JSON.stringify(prompts, null, 2);
      htmlString = htmlString.replace(/const INITIAL_PROMPTS = \[[\s\S]*?\];/, `const INITIAL_PROMPTS = ${serializedData};`);
      
      const blob = new Blob([htmlString], { type: "text/html;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Prompt_Vault_Backup.html";
      a.click();
      URL.revokeObjectURL(url);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body></html>
